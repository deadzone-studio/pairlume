name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      # Bluetooth (BlueZ over D-Bus)
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: python3 share/lang/check.py
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  window:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git rust qt6-declarative layer-shell-qt ttf-dejavu
      - uses: actions/checkout@v4
      - run: cargo build --locked -p pairlume-ui
      - name: Every window loads
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_FORCE_STDERR_LOGGING: "1"
          PAIRLUME_DIR: /tmp/pairlume
          PAIRLUME_SOCKET: /tmp/pairlume.sock
        # each runs until it is stopped (124); a window that does not load ends it with 1
        run: |
          for w in "" messages panel bubbles calls settings; do
            XDG_RUNTIME_DIR=$(mktemp -d) timeout 8 target/debug/pairlume-ui $w || [ $? -eq 124 ] || { echo "window '$w' did not load"; exit 1; }
          done
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # the Kotlin phone is tested against the real service
      - run: cargo build --locked
      - run: ./gradlew --no-daemon :core:test :app:lintDebug :app:assembleDebug
        working-directory: android
