name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      # Bluetooth (BlueZ over D-Bus)
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  window:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git rust qt6-declarative layer-shell-qt ttf-dejavu
      - uses: actions/checkout@v4
      - run: cargo build --locked -p pairlume-ui
      - name: The window loads
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_FORCE_STDERR_LOGGING: "1"
          PAIRLUME_DIR: /tmp/pairlume
          PAIRLUME_SOCKET: /tmp/pairlume.sock
        # it runs until it is stopped (124); without its window it ends with 1
        run: timeout 8 target/debug/pairlume-ui || [ $? -eq 124 ]
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # the Kotlin phone is tested against the real service
      - run: cargo build --locked
      - run: ./gradlew --no-daemon :core:test :app:lintDebug :app:assembleDebug
        working-directory: android
