[workspace]
resolver = "3"
members = ["crates/*"]
# pairlume-ui needs Qt 6 and layer-shell-qt: cargo build -p pairlume-ui
default-members = ["crates/pairlume-core", "crates/pairlumed", "crates/pairlume-fake"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/deadzone-studio/pairlume"

[workspace.dependencies]
anyhow = "1"
bluer = { version = "0.17", features = ["bluetoothd"] }
clap = { version = "4", features = ["derive"] }
mdns-sd = "0.22"
qrcode = { version = "0.15", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
