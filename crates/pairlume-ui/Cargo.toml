[package]
name = "pairlume-ui"
description = "Pairlume's windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pairlume-core = { path = "../pairlume-core" }
pairlumed = { path = "../pairlumed" }
anyhow.workspace = true
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_qml", "qt_gui"] }
dbus = "0.9"
qrcode.workspace = true
serde_json.workspace = true

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

# cxx writes unsafe code for the bridge, so the rule of the other crates cannot be used here
[lints.rust]
unused_must_use = "deny"
